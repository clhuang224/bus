name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  workspace-checks:
    name: ${{ matrix.workspace }} / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '@bus/web'
            command: lint
          - workspace: '@bus/web'
            command: typecheck
          - workspace: '@bus/web'
            command: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm --filter "${{ matrix.workspace }}" run ${{ matrix.command }}

  map-browser-test:
    name: Web map / production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm --filter @bus/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bus/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: map-browser-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

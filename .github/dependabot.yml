version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    assignees:
      - clhuang224
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    assignees:
      - clhuang224
    cooldown:
      default-days: 3
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
          - major

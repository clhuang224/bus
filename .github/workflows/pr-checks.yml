name: PR Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  workspace-checks:
    name: ${{ matrix.workspace }} / ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '@bus/web'
            command: lint
          - workspace: '@bus/web'
            command: typecheck
          - workspace: '@bus/web'
            command: test
          # The production web app runs the shared realtime calculation.
          - workspace: '@bus/shared'
            command: lint
          - workspace: '@bus/shared'
            command: typecheck
          - workspace: '@bus/shared'
            command: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm --filter "${{ matrix.workspace }}" run ${{ matrix.command }}

  map-browser-test:
    name: Web map / production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm --filter @bus/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bus/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: map-browser-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

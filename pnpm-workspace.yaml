packages:
  - apps/*
  - packages/*
overrides:
  '@prisma/dev>@hono/node-server': 1.19.13
  form-data: 4.0.6
  hono: 4.12.25
  '@react-router/serve>morgan': 1.11.0
  js-yaml: 4.2.0
  # GHSA-2v37-7h3g-55p8: keep Nano ID 3.x on the patched release.
  'nanoid@<3.3.18': 3.3.18
  # GHSA-rgj7-g3m4-5g8c: Miniflare 4 still pins an older sharp release.
  'miniflare>sharp': 0.35.4
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@4.20260714.0
  - wrangler@4.112.0
